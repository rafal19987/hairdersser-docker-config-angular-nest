name: Update submodules

# Points backend, frontend and landing-page at their latest develop.
# The app repositories trigger it after a merge to develop (repository_dispatch);
# the daily run catches a missed trigger, and it can also be started by hand.
on:
  repository_dispatch:
    types: [app-develop-updated]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Merges in two apps close together must not push over each other
concurrency:
  group: update-submodules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      # A shallow submodule checkout fetches only the default branch, so --remote
      # could not find develop; cloning the submodules here fetches every branch
      - name: Point submodules at the latest develop
        run: git submodule update --init --remote

      # master accepts changes only through pull requests, so the bot opens one and merges it
      - name: Merge the new pointers through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/update-submodules
          TRIGGERED_BY: ${{ github.event.client_payload.repository || github.event_name }}
        run: |
          if git diff --quiet; then
            echo "Submodules already point at the latest develop"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add backend frontend landing-page
          git commit -m "chore: update submodules to latest develop" -m "Triggered by: $TRIGGERED_BY" -m "$(git submodule status)"
          git push --force origin "$BRANCH"

          # An earlier failed run may have left its pull request open
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" != "OPEN" ]; then
            gh pr create --base master --head "$BRANCH"               --title "chore: update submodules to latest develop"               --body "Triggered by: $TRIGGERED_BY"
          fi

          # GitHub needs a moment to compute whether the pull request can be merged
          for attempt in 1 2 3 4 5; do
            gh pr merge "$BRANCH" --merge --delete-branch && exit 0
            sleep 5
          done
          exit 1
